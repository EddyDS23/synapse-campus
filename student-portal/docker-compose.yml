
services:

  mariadb:
    image: mariadb:11.4
    environment:
      - MARIADB_ROOT_PASSWORD=12345678
      - MARIADB_DATABASE=student_portal_system
      - MARIADB_USER=student_portal_user
      - MARIADB_PASSWORD=12345678
    expose:
      - "3306" 
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - student-portal-network


  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "9000"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    networks:
      - student-portal-network
      - synapse-campus-network
    depends_on:
      - mariadb   

  nginx:
    image: nginx:alpine
    container_name: nginx-student-portal
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - student-portal-network
      - synapse-campus-network
      - proxy_network
    depends_on:
      - app

networks:
  student-portal-network:
  synapse-campus-network:
    external: true
  proxy_network:
    external: true

volumes:
  mariadb_data: