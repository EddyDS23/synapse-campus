
  services:

    mariadb:
      image: mariadb:11.4
      environment:
        - MARIADB_ROOT_PASSWORD=12345678
        - MARIADB_DATABASE=auth_vault_api
        - MARIADB_USER=auth_user
        - MARIADB_PASSWORD=12345678
      expose:
        - "3306"
      networks:
        - auth-value-network
      volumes:
        - mariadb_data:/var/lib/mysql

    redis:
      image: redis:alpine
      expose:
        - "6379"
      networks:
        - auth-value-network
      deploy:
        resources:
          limits:
            memory: 258M
          reservations:
            memory: 128M

    app:
      build:
        context: .
        dockerfile: Dockerfile
      env_file:
        - .env
      volumes:
        - .:/var/www/html
      networks:
        - auth-value-network
      expose:
        - "9000"
      depends_on:
        - mariadb
        - redis

    nginx:
      image: nginx:alpine
      container_name: auth-vault-nginx
      volumes:
        - .:/var/www/html
        - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      networks:
        - auth-value-network
        - proxy_network
      depends_on:
        - app

  networks:
    auth-value-network:
    proxy_network:
      external: true

  volumes:
    mariadb_data:
