
services:
  mariadb:
    image: mariadb:11.4
    environment:
      - MARIADB_ROOT_PASSWORD=12345678
      - MARIADB_DATABASE=support_desk_system
      - MARIADB_USER=support_desk_user
      - MARIADB_PASSWORD=12345678
    expose:
      - "3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - support_desk_network
    healthcheck:
      test: ["CMD", "mariadb-admin","-p12345678","ping","-h","localhost"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    cpus: "2"
  
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "9000"
    networks:
      - support_desk_network
      - synapse-campus-network
    volumes:
      - .:/var/www/html
    depends_on:
      mariadb:
          condition: service_healthy
    mem_limit: 512m
    cpus: "1"

  nginx:
    image: nginx:alpine
    container_name: support_desk_nginx
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - support_desk_network
      - synapse-campus-network
      - proxy_network
    depends_on:
        app:
          condition: service_started
    healthcheck:
      test: ["CMD", "curl", "http://localhost/up"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    cpus: "0.5"

networks:
  support_desk_network:
  synapse-campus-network:
      external: true
  proxy_network:
      external: true


volumes:
  mariadb_data: