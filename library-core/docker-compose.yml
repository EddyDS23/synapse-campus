
services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=12345678
      - MARIADB_DATABASE=library_core_system
      - MARIADB_USER=library_core_user
      - MARIADB_PASSWORD=12345678
    expose:
      - "3306"
    networks:
      - library_core_network
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin","-p12345678","ping","-h","localhost"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    cpus: "2"


  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    expose:
      - "9000"
    networks:
      - library_core_network
      - synapse-campus-network
    depends_on:
      mariadb:
        condition: service_healthy
    mem_limit: 512m
    cpus: "1"

  nginx: 
      image: nginx:alpine
      container_name: library_core_nginx
      volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      networks:
      - library_core_network
      - synapse-campus-network
      - proxy_network
      depends_on:
        app:
          condition: service_started
      healthcheck:
        test: ["CMD", "curl", "-fsS", "http://localhost/up"]
        interval: 20s
        timeout: 5s
        retries: 5
        start_period: 30s
      mem_limit: 256m
      cpus: "0.5"
    

networks:
  library_core_network:
  synapse-campus-network:
    external: true
  proxy_network:
    external: true
    



volumes:
  mariadb_data: