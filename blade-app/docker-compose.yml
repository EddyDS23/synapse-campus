
services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    expose:
      - "9000"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    networks:
      - blade-app-network
      - synapse-campus-network
    depends_on: []

  nginx:
    image: nginx:alpine
    container_name: nginx-blade-app
    ports:
      - "9006:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - blade-app-network
      - synapse-campus-network
    depends_on:
      - app

networks:
    blade-app-network:
    synapse-campus-network:
      external: true
      


