
services:
  mariadb:
    image: mariadb:11.4
    environment:
      - MARIADB_DATABASE=${DB_DATABASE}
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_USER=${DB_USERNAME}
      - MARIADB_PASSWORD=${DB_PASSWORD}
    expose:
      - "3306"
    networks:
      - audit_logs_network
    volumes:
      - mariadb_data:/var/lib/mysql


  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    networks:
      - audit_logs_network
      - synapse-campus-network
    expose:
      - "9000"
    depends_on:
      - mariadb


  nginx:
    image: nginx:alpine
    container_name: audit_logs_nginx
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - audit_logs_network
      - synapse-campus-network
    expose:
      - "80"
    depends_on:
      - app




networks:
  audit_logs_network:
  synapse-campus-network:
    external: true


volumes:
  mariadb_data:

