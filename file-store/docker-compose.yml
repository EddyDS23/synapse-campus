
services:

  mariadb:
    image: mariadb:11.4
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_DATABASE}
      - MARIADB_USER=${DB_USERNAME}
      - MARIADB_PASSWORD=${DB_PASSWORD}
    expose:
      - "3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - file-store-network
    healthcheck:
      test: ["CMD", "mariadb-admin","-p12345678", "ping", "-h", "localhost"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 2g 
    cpus: "1"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "9000"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - filestore_data:/var/www/html/storage/app
    networks:
      - file-store-network
      - synapse-campus-network
    depends_on:
      mariadb:
        condition: service_healthy    
    mem_limit: 512m
    cpus: "0.5"

  nginx:
    image: nginx:alpine
    container_name: file_store_nginx
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - file-store-network
      - synapse-campus-network
      - proxy_network
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    cpus: "0.5"


networks:
  file-store-network:
  synapse-campus-network:
    external: true
  proxy_network:
    external: true

volumes:
  mariadb_data:
  filestore_data: